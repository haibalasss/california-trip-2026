name: Sync games data into git

on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: games-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Copy photos and game events from the inboxes into the repo
        run: node scripts/games-sync.mjs
      - name: Commit and publish if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add site/nature site/road-archive.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git -c user.name="trip-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Games: sync photos and events"
          git pull --rebase -q && git push
          gh workflow run deploy.yml --ref main
