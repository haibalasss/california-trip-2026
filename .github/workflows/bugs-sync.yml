name: Sync bug tickets into git

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bugs-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Copy new tickets from the inbox into site/bugs.json
        run: node scripts/bugs-sync.mjs
      - name: Commit if anything changed
        run: |
          git add site/bugs.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git -c user.name="trip-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Bug tickets: sync from app"
          git pull --rebase -q && git push
