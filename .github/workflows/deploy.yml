name: Deploy trip site

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"   # flight status refresh; skipped outside the trip window
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      - name: Trip window check
        id: win
        run: |
          d=$(TZ=America/Los_Angeles date +%F)
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && ( "$d" < "2026-11-19" || "$d" > "2026-11-26" ) ]]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.win.outputs.skip != '1'

      - uses: actions/setup-node@v5
        if: steps.win.outputs.skip != '1'
        with:
          node-version: 20

      - name: Fetch flight status
        if: steps.win.outputs.skip != '1'
        continue-on-error: true
        run: node scripts/flights.mjs site/flights.json

      - uses: actions/configure-pages@v5
        if: steps.win.outputs.skip != '1'

      - uses: actions/upload-pages-artifact@v4
        if: steps.win.outputs.skip != '1'
        with:
          path: site

      - id: deployment
        if: steps.win.outputs.skip != '1'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      # GitHub's artifact service is sometimes slow to register the upload; wait and retry once.
      - name: Wait before retry
        if: steps.win.outputs.skip != '1' && steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: deployment2
        if: steps.win.outputs.skip != '1' && steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

  # On every push: check that flight status can be read at all (green = works, red = source blocked).
  probe-flights:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Read flight status (FlightAware / FlightStats)
        env:
          PROBE: "1"
        run: node scripts/flights.mjs
