<title>California Trip 2026</title>

<style>
/* Layout: phone-first road book. Sticky header with day strip, one day per screen, quiet "around you" drawer at the bottom of each day. */
:root{
  --bg:#EEF2F3; --surface:#FFFFFF; --ink:#11232B; --muted:#5B6E76; --line:#D5DEE1;
  --sea:#0E5E6F; --sea-soft:#DCECEF; --bridge:#D2462A; --bridge-soft:#FBE4DD;
  --warn:#9A5B00; --warn-soft:#FFF1D6; --ok:#2E7D4F; --ok-soft:#E1F2E7; --on-sea:#FFFFFF;
  --f-display:"Rubik","Heebo",system-ui,sans-serif;
  --f-body:"Heebo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C171C; --surface:#13232A; --ink:#E6EEF0; --muted:#93A6AD; --line:#24373F;
  --sea:#5FC0D1; --sea-soft:#163840; --bridge:#FF7A5C; --bridge-soft:#3A1F19;
  --warn:#F2B654; --warn-soft:#33270F; --ok:#6CCB90; --ok-soft:#14301F; --on-sea:#0C171C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C171C; --surface:#13232A; --ink:#E6EEF0; --muted:#93A6AD; --line:#24373F;
  --sea:#5FC0D1; --sea-soft:#163840; --bridge:#FF7A5C; --bridge-soft:#3A1F19;
  --warn:#F2B654; --warn-soft:#33270F; --ok:#6CCB90; --ok-soft:#14301F; --on-sea:#0C171C; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr,#0E5E6F);transition:background-color .5s ease}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--sea)}
:focus-visible{outline:2px solid var(--bridge);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hdr,#0E5E6F);color:#fff;transition:background-color .5s ease}
header .wrap{padding-block:12px 0;display:grid;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:800;font-size:20px;margin:0;letter-spacing:.2px}
.lock{border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:999px;padding:3px 10px;font-size:12.5px}
.tabs{display:flex;gap:4px}
.tab{border:0;background:transparent;color:#fff;opacity:.75;padding:8px 10px 10px;font-weight:500;border-bottom:3px solid transparent}
.tab[aria-selected="true"]{opacity:1;border-bottom-color:#fff}

.strip{display:flex;gap:8px;overflow-x:auto;padding-block:14px 4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-width:64px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 10px;text-align:center;display:grid;gap:0}
.chip b{font-family:var(--f-display);font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.chip span{font-size:11.5px;color:var(--muted)}
.chip i{font-style:normal;font-size:13px;line-height:1}
.chip[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-selected="true"] span{color:inherit;opacity:.8}
.chip .today{display:block;font-size:10px;color:var(--bridge);font-weight:700}

main{padding-block:12px 48px;display:grid;gap:16px}
.dayhead{display:grid;gap:2px}
.dayhead .eyebrow{font-size:12px;letter-spacing:.6px;color:var(--muted);font-weight:500}
.dayhead h2{font-family:var(--f-display);font-size:26px;margin:0;text-wrap:balance;line-height:1.2}
.dayhead .sleep{font-size:13.5px;color:var(--muted)}
.dayhead .sleep b{color:var(--ink);font-weight:500}

.count{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;background:var(--sea-soft);border-radius:var(--r);padding:10px 14px;font-size:14px}
.count b{font-family:var(--f-display);font-size:18px;color:var(--sea);font-variant-numeric:tabular-nums}

.alerts{display:grid;gap:8px}
.alert{background:var(--warn-soft);border-radius:12px;padding:10px 12px;font-size:14px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.alert .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);margin-top:8px}
.alert.danger{background:var(--bridge-soft)} .alert.danger .dot{background:var(--bridge)}
.alert b{font-weight:700}

.timeline{display:grid;gap:0;position:relative}
.ev{display:grid;grid-template-columns:52px 1fr;gap:12px;position:relative;padding-bottom:14px}
.ev::before{content:"";position:absolute;right:25px;top:28px;bottom:0;width:2px;background:var(--line)}
.ev:last-child::before{display:none}
.time{font-family:var(--f-display);font-weight:700;font-size:15px;text-align:center;font-variant-numeric:tabular-nums;padding-top:12px;position:relative;z-index:1}
.time small{display:block;font-family:var(--f-body);font-weight:400;font-size:11px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px;min-width:0}
.card.k-flight{border-inline-start:4px solid var(--bridge)}
.card.k-stay{border-inline-start:4px solid var(--sea)}
.card.k-car{border-inline-start:4px solid var(--ink)}
.card.k-act{border-inline-start:4px solid var(--ok)}
.card.k-drive{background:transparent;border-style:dashed}
.kind{font-size:11.5px;font-weight:700;letter-spacing:.5px;color:var(--muted)}
.card h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.3}
.card p{margin:0;font-size:14px;color:var(--muted)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;margin:0;align-items:center}
.facts dt{color:var(--muted)} .facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.code{font-family:var(--f-mono);font-size:13px;background:var(--sea-soft);padding:1px 6px;border-radius:6px;border:0;color:var(--ink)}
button.code:hover{outline:1px solid var(--sea)}
.reveal{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line);background:var(--bg);border-radius:6px;padding:1px 8px;font-size:12.5px;color:var(--muted)}
.reveal .dots{font-family:var(--f-mono);letter-spacing:1px}
.reveal .lbl{color:var(--sea);font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:13px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--sea);border-color:var(--sea);color:var(--on-sea)}
.note{font-size:13px;background:var(--bg);border-radius:10px;padding:8px 10px;color:var(--ink)}
.seats{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px;align-items:center}
.seats span{background:var(--bg);border-radius:8px;padding:2px 8px}
.seats b{font-family:var(--f-mono);font-weight:500}

.fstat{border-radius:10px;padding:8px 10px;background:var(--sea-soft);display:grid;gap:4px;font-size:13.5px}
.fstat.bad{background:var(--bridge-soft)} .fstat.good{background:var(--ok-soft)}
.fstat .row1{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.fstat .st{font-weight:700}
.fstat .gate{font-family:var(--f-display);font-size:20px;font-weight:700}
.fstat small{color:var(--muted);font-size:11.5px}
.banner{background:var(--bridge);color:#fff;border-radius:var(--r);padding:10px 14px;font-size:14px}
.banner b{font-family:var(--f-display)}

.tips{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.tips li{font-size:14px;padding-inline-start:16px;position:relative}
.tips li::before{content:"";position:absolute;right:0;top:9px;width:6px;height:6px;border-radius:2px;background:var(--sea)}
.sect-title{font-family:var(--f-display);font-size:15px;margin:0 0 6px;color:var(--muted);font-weight:500}

details.around{border-top:1px solid var(--line);padding-top:10px}
details.around summary{cursor:pointer;font-size:13.5px;color:var(--muted);list-style:none;display:flex;justify-content:space-between;align-items:center}
details.around summary::-webkit-details-marker{display:none}
details.around summary::after{content:"＋";font-size:14px}
details.around[open] summary::after{content:"－"}
.evts{display:grid;gap:8px;margin-top:10px}
.evt{font-size:13.5px;display:grid;gap:1px;padding:8px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.evt b{font-weight:500}
.evt span{color:var(--muted);font-size:12.5px}
.src{font-size:11.5px;color:var(--muted);margin:0}

/* place hero: hand-drawn SVG landscape per region */
.hero{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:2.15/1;min-height:172px;max-height:260px;display:flex;align-items:flex-end;color:#fff;isolation:isolate;box-shadow:0 1px 0 var(--line)}
.hero svg{position:absolute;inset:0;width:100%;height:100%;z-index:-2;display:block}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(8,12,20,0) 30%,rgba(8,12,20,.62) 100%)}
.hero .txt{padding:18px 18px 16px;display:grid;gap:2px;width:100%}
.hero .place{font-family:var(--f-display);font-weight:500;font-size:11.5px;letter-spacing:2.4px;text-transform:uppercase;opacity:.9;direction:ltr;text-align:right}
.hero h2{font-family:var(--f-display);font-size:27px;font-weight:800;margin:0;line-height:1.15;text-wrap:balance;text-shadow:0 1px 12px rgba(0,0,0,.35)}
.hero .meta{font-size:13px;opacity:.92;display:flex;flex-wrap:wrap;gap:2px 10px}
.hero .meta b{font-weight:500}
.hero.enter svg{animation:heroIn .6s ease both}
@keyframes heroIn{from{transform:scale(1.04);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.hero.enter svg{animation:none}}

.wxrow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.wxrow.bad{border-color:var(--warn);background:var(--warn-soft)}
.wxi{font-size:28px;line-height:1;text-align:center}
.wxt{min-width:0;display:grid;gap:1px}
.wxt b{font-weight:500;font-size:14.5px}
.wxt span{font-size:12.5px;color:var(--muted)}
.wxn{text-align:left;font-variant-numeric:tabular-nums;display:grid;gap:0}
.wxn b{font-family:var(--f-display);font-size:18px}
.wxn span{font-size:11.5px;color:var(--muted)}
.wxfoot{font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.live{color:var(--ok);font-weight:700}

/* docs + packing */
.group{display:grid;gap:8px}
.group h2{font-family:var(--f-display);font-size:18px;margin:8px 0 0}
.row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.row .l{font-weight:500;min-width:0} .row .s{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.pack{display:grid;gap:6px}
.pack label{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}
.pack input{width:18px;height:18px;accent-color:var(--sea)}
.pack input:checked + span{text-decoration:line-through;color:var(--muted)}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok);width:0;transition:width .2s}

/* unlock sheet */
.scrim{position:fixed;inset:0;background:rgba(5,15,20,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}

.sheet p{margin:0;font-size:14px;color:var(--muted)}

.sheet .remember{display:flex;gap:8px;align-items:center;font-size:14px}
.sheet .err{color:var(--bridge);font-size:13.5px;min-height:1.2em}
.sheet .btns{display:flex;gap:8px}
.sheet .btns button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.sheet .btns .go{background:var(--sea);border-color:var(--sea);color:var(--on-sea);font-weight:700}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;z-index:40}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

</div>

      <rect width="400" height="160" fill="url(#sfs)"/><circle cx="318" cy="98" r="20" fill="#FBDDB2" opacity=".85"/>
      <path d="M0 108 Q50 86 105 100 T215 94 T320 102 T400 96 V160 H0Z" fill="#5E4E6E" opacity=".75"/>
      <path d="M0 100 Q90 92 200 99 T400 97 V108 H0Z" fill="#fff" opacity=".16"/>
      <rect y="112" width="400" height="48" fill="url(#sfw)"/>
      <path d="M300 118 h36 M286 126 h52 M296 134 h30" stroke="#FBDDB2" stroke-width="1.2" opacity=".35"/>
      <g fill="#A63A28">${tower(110)}${tower(290)}<rect x="0" y="103" width="400" height="3.5"/></g>
      <g stroke="#A63A28" fill="none"><path d="M-10 100 Q55 86 110 42 Q200 120 290 42 Q345 86 410 100" stroke-width="1.6"/><path d="${cables}" stroke-width=".45" opacity=".8"/></g>`; }},
  yos:{label:"Yosemite · El Portal", hdr:"#3E5161", svg:()=>{
    const r=rng(7); let snow=""; for(let i=0;i<70;i++) snow+=`<circle cx="${fx(r()*400)}" cy="${fx(r()*150)}" r="${fx(.5+r()*1.1)}"/>`;
    let trees=""; [[14,150,34],[34,152,26],[52,151,40],[70,153,24],[300,152,30],[318,150,42],[338,153,28],[358,151,36],[380,153,26],[396,150,38]].forEach(([x,b,h])=>trees+=pine(x,b,h,"#22392F"));
    return `<defs><linearGradient id="yss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7F97AD"/><stop offset="1" stop-color="#D9E2E9"/></linearGradient>
      <linearGradient id="ysr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6F7E8E"/><stop offset="1" stop-color="#9AA7B4"/></linearGradient></defs>
      <rect width="400" height="160" fill="url(#yss)"/>
      <path d="M0 112 Q70 92 140 104 T280 98 T400 104 V160 H0Z" fill="#AEBBC7"/>
      <path d="M176 136 C186 96 202 52 238 40 Q252 36 262 38 L264 136Z" fill="url(#ysr)"/>
      <path d="M190 84 C200 62 214 46 238 40 Q252 36 262 38" stroke="#fff" stroke-width="2.4" fill="none" opacity=".85"/>
      <path d="M262 38 L264 136" stroke="#5B6876" stroke-width="1.5"/>
      <path d="M0 136 L0 58 Q24 50 52 54 Q80 60 92 80 L112 136Z" fill="#5C6A78"/>
      <path d="M0 58 Q24 50 52 54 Q74 58 86 70" stroke="#fff" stroke-width="2" fill="none" opacity=".8"/>
      <path d="M0 148 Q100 136 200 142 T400 140 V160 H0Z" fill="#EEF3F7"/>
      ${trees}<g fill="#fff" opacity=".75">${snow}</g>`; }},
  mry:{label:"Monterey · Carmel", hdr:"#1E5560", svg:()=>{
    return `<defs><linearGradient id="mys" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FA4B5"/><stop offset=".75" stop-color="#E9D6B8"/></linearGradient>
      <linearGradient id="myw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A8796"/><stop offset="1" stop-color="#173F4A"/></linearGradient></defs>
      <rect width="400" height="160" fill="url(#mys)"/><circle cx="92" cy="96" r="15" fill="#FFF1D6" opacity=".9"/>
      <path d="M0 104 Q40 100 90 103 L90 106 H0Z" fill="#7C8F95" opacity=".6"/>
      <rect y="104" width="400" height="56" fill="url(#myw)"/>
      <path d="M60 112 h50 M30 122 h40 M120 128 h60 M70 140 h70 M180 116 h30" stroke="#FFF1D6" stroke-width="1" opacity=".35"/>
      <path d="M232 160 L244 128 Q262 112 292 114 L330 104 Q362 102 382 94 L400 92 V160Z" fill="#3E3532"/>
      <path d="M244 128 Q262 112 292 114 L330 104 Q362 102 382 94" stroke="#6B5A52" stroke-width="2" fill="none"/>
      <path d="M248 160 Q262 150 290 152 Q300 146 320 150" stroke="#fff" stroke-width="1.4" fill="none" opacity=".5"/>
      <g fill="#1F332C"><path d="M331 106 C328 94 320 88 324 74 L328 74 C328 88 336 94 336 106Z"/>
        <ellipse cx="326" cy="70" rx="36" ry="8.5"/><ellipse cx="312" cy="79" rx="24" ry="6.5"/><ellipse cx="342" cy="60" rx="24" ry="7"/><ellipse cx="350" cy="72" rx="14" ry="5"/></g>
      <path d="M150 50 q5 -5 10 0 q5 -5 10 0 M178 38 q4 -4 8 0 q4 -4 8 0" stroke="#2C4A52" stroke-width="1.3" fill="none"/>`; }},
  la:{label:"Los Angeles · Venice", hdr:"#3A2C59", svg:(plane)=>{
    const r=rng(11); let stars=""; for(let i=0;i<24;i++) stars+=`<circle cx="${fx(r()*400)}" cy="${fx(r()*40)}" r="${fx(.4+r()*.7)}"/>`;
    let wheel=`<circle cx="70" cy="80" r="18" fill="none"/>`; for(let a=0;a<12;a++){ const t=a*Math.PI/6; wheel+=`<path d="M70 80 L${fx(70+18*Math.cos(t))} ${fx(80+18*Math.sin(t))}"/>`; }
    return `<defs><linearGradient id="las" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A2150"/><stop offset=".45" stop-color="#B3507A"/><stop offset=".8" stop-color="#F29A5E"/><stop offset="1" stop-color="#FBD08A"/></linearGradient>
      <linearGradient id="law" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5A3A63"/><stop offset="1" stop-color="#1E1636"/></linearGradient></defs>
      <rect width="400" height="160" fill="url(#las)"/><g fill="#fff" opacity=".6">${stars}</g>
      <circle cx="214" cy="110" r="30" fill="#FFE1A6"/>
      <rect y="110" width="400" height="50" fill="url(#law)"/>
      <path d="M192 118 h44 M198 126 h32 M204 134 h20 M208 142 h12" stroke="#FFE1A6" stroke-width="1.6" opacity=".6"/>
      <g stroke="#1A1330" stroke-width="1.2">${wheel}<path d="M0 104 H140 M10 104V116 M30 104V116 M50 104V116 M70 104V116 M90 104V116 M110 104V116 M130 104V116 M70 80 L62 104 M70 80 L78 104"/></g>
      ${palm(300,160,92,-10,"#1A1330")}${palm(330,160,74,8,"#1A1330")}${palm(362,160,104,-4,"#1A1330")}${palm(250,160,60,6,"#1A1330")}
      ${plane?`<path d="M130 40 l24 -6 l6 -8 l3 0 l-3 9 l14 -3 l4 -4 l2 0 l-2 6 l-2 3 l-2 0 l-14 2 l-5 8 l-3 0 l2 -7 l-22 2Z" fill="#1A1330" opacity=".85"/>`:""}`; }},
  home:{label:"LAX → Fort Lauderdale", hdr:"#3A2C59"}
};
SCENES.home.svg=()=>SCENES.la.svg(true);
function sceneSVG(d){ const k=sceneKey(d); return `<svg viewBox="0 0 400 160" preserveAspectRatio="xMidYMax slice" aria-hidden="true" focusable="false">${SCENES[k].svg()}</svg>`; }
let heroEnter=true, lastDay=-1;

/* ---------- helpers ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const maps = q=>"https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(q);
const store = {get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast._);toast._=setTimeout(()=>t.hidden=true,1600)}
function copy(txt){
  const fallback=()=>{const el=document.createElement("span");el.textContent=txt;document.body.append(el);const r=document.createRange(),s=getSelection();r.selectNodeContents(el);s.removeAllRanges();s.addRange(r);toast("סמנו והעתיקו: "+txt);setTimeout(()=>el.remove(),3000)};
  try{navigator.clipboard.writeText(txt).then(()=>toast("הועתק: "+txt),fallback)}catch(e){fallback()}
}

/* ---------- vault ---------- */
let SECRETS=null;
const b64d = s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64e = u=>btoa(String.fromCharCode(...new Uint8Array(u)));
async function deriveKey(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64d(VAULT.salt),iterations:VAULT.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
async function openVault(key){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(VAULT.iv)},key,b64d(VAULT.ct));
  SECRETS=JSON.parse(new TextDecoder().decode(pt));
}
async function tryStoredKey(){
  const raw=store.get("vaultkey",null); if(!raw||!VAULT) return;
  try{ const key=await crypto.subtle.importKey("raw",b64d(raw),{name:"AES-GCM"},false,["decrypt"]); await openVault(key); render(); }
  catch(e){ store.del("vaultkey"); }
}
function askUnlock(){ $("#unlock").hidden=false; $("#pwerr").textContent=""; $("#pw").value=""; setTimeout(()=>$("#pw").focus(),50); }
$("#cancel").onclick=()=>$("#unlock").hidden=true;
$("#unlock").addEventListener("click",e=>{ if(e.target.id==="unlock") $("#unlock").hidden=true; });
$("#unlockform").addEventListener("submit",async e=>{
  e.preventDefault();
  if(!VAULT||!crypto.subtle){ $("#pwerr").textContent="הדפדפן הזה לא תומך בפענוח."; return; }
  $("#pwerr").textContent="בודק…";
  try{
    const key=await deriveKey($("#pw").value); await openVault(key);
    if($("#remember").checked) store.set("vaultkey",b64e(await crypto.subtle.exportKey("raw",key)));
    $("#unlock").hidden=true; render(); toast("הפרטים מוצגים");
  }catch(err){ $("#pwerr").textContent="הסיסמה שגויה. נסו שוב."; }
});
$("#lockbtn").onclick=()=>{ if(SECRETS){ SECRETS=null; store.del("vaultkey"); render(); toast("הפרטים הוסתרו"); } else askUnlock(); };

document.addEventListener("click",e=>{
  const c=e.target.closest("[data-copy]"); if(c){copy(c.dataset.copy);return}
  if(e.target.closest(".reveal")) askUnlock();
});

function secret(v){
  if(v&&typeof v==="object"&&v.s){
    if(SECRETS&&SECRETS[v.s]!=null) return `<button class="code" data-copy="${esc(SECRETS[v.s])}" title="העתקה">${esc(SECRETS[v.s])}</button>`;
    return `<button class="reveal" type="button"><span class="dots">••••••</span><span class="lbl">הצג</span></button>`;
  }
  return esc(v);
}

function pacificToday(){ return new Date().toLocaleDateString("en-CA",{timeZone:"America/Los_Angeles"}); }
function untilText(iso){
  const ms=new Date(iso)-new Date(); if(ms<=0) return null;
  const m=Math.round(ms/60000), d=Math.floor(m/1440), h=Math.floor((m%1440)/60), mm=m%60;
  if(d>0) return `${d} ימים ו-${h} שעות`; if(h>0) return `${h} שעות ו-${mm} דקות`; return `${mm} דקות`;
}

/* ---------- state ---------- */
let view=store.get("view","days");
const today=pacificToday();
let dayIdx=Math.max(0,DAYS.findIndex(d=>d.d===today));
if(today>DAYS[DAYS.length-1].d) dayIdx=DAYS.length-1;

function wxFor(date,loc){ return (WXLIVE&&WXLIVE[date+"|"+loc])||WXSTATIC[date+"|"+loc]; }
function renderStrip(){
  const s=$("#strip"); s.hidden = view!=="days";
  s.innerHTML=DAYS.map((d,i)=>{const w=wxFor(d.d,WXPLAN[d.d][0]);return `<button class="chip" role="tab" aria-selected="${i===dayIdx}" data-i="${i}">
    ${d.d===today?'<span class="today">היום</span>':""}<b>${+d.d.slice(8)}</b><span>${d.dow}</span>${w?`<i aria-hidden="true">${wmo(w.c)[0]}</i>`:""}</button>`}).join("");
  s.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{dayIdx=+c.dataset.i;render();window.scrollTo({top:0})});
  const sel=s.querySelector('[aria-selected="true"]'); if(sel) sel.scrollIntoView({inline:"center",block:"nearest"});
}

function flightBox(fl){
  const x=flightInfo(fl); if(!x) return "";
  const bad=flightBad(x), st=STATUS_HE[x.status]||x.status||"";
  const upd=FLIGHTS.updated?new Date(FLIGHTS.updated).toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"}):"";
  return `<div class="fstat ${bad?"bad":"good"}"><div class="row1"><span class="st">${esc(st)}</span>
    ${x.depGate?`<span>שער <span class="gate">${esc(x.depGate)}</span></span>`:`<span>שער: עוד לא פורסם</span>`}
    ${x.depTerminal?`<span>טרמינל ${esc(x.depTerminal)}</span>`:""}</div>
    ${x.depRevised&&hhmm(x.depRevised)!==hhmm(x.depSched)?`<span>המראה מעודכנת: <b>${hhmm(x.depRevised)}</b> (במקום ${hhmm(x.depSched)})</span>`:""}
    ${x.arrRevised?`<span>נחיתה משוערת: ${hhmm(x.arrRevised)}${x.baggage?` · מסוע ${esc(x.baggage)}`:""}</span>`:""}
    <small>עדכון אחרון ${upd} · הגייט מתפרסם בדרך כלל 1–2 שעות לפני הטיסה</small></div>`;
}

function itemHTML(it){
  const facts=it.facts?`<dl class="facts">${it.facts.map(([l,v])=>`<dt>${l}</dt><dd>${secret(v)}</dd>`).join("")}</dl>`:"";
  let seats="";
  if(it.seats){ seats = SECRETS&&SECRETS[it.seats]
      ? `<div class="seats">${Object.entries(SECRETS[it.seats]).map(([n,s])=>`<span>${esc(n)} <b>${esc(s)}</b></span>`).join("")}</div>`
      : `<div class="seats"><span>מושבים <b>${esc(it.seatList)}</b></span><button class="reveal" type="button"><span class="lbl">הצג שמות</span></button></div>`; }
  const acts=[];
  if(it.addr) acts.push(`<a class="btn primary" href="${maps(it.addr)}" target="_blank" rel="noopener">ניווט</a>`);
  if(it.nav) acts.push(`<a class="btn primary" href="${maps(it.nav)}" target="_blank" rel="noopener">פתיחת מסלול</a>`);
  if(it.phone) acts.push(`<a class="btn" href="tel:${it.phone.replace(/[^+\d]/g,"")}">${esc(it.phone)}</a><button class="btn" data-copy="${esc(it.phone)}">העתקת מספר</button>`);
  const u=it.countdown&&untilText(it.countdown);
  return `<div class="ev"><div class="time">${esc(it.time)}${it.tz?`<small>${it.tz}</small>`:""}</div>
   <article class="card k-${it.k}"><div class="kind">${esc(it.kind)}</div><h3>${esc(it.title)}</h3>
   ${it.sub?`<p>${esc(it.sub)}</p>`:""}${u?`<p>עוד <b style="color:var(--sea)">${u}</b></p>`:""}
   ${it.fl?flightBox(it.fl):""}${facts}${seats}
   ${it.note?`<div class="note">${esc(it.note)}</div>`:""}
   ${acts.length?`<div class="actions">${acts.join("")}</div>`:""}</article></div>`;
}

function wxHTML(date){
  const locs=WXPLAN[date]; if(!locs) return "";
  const live=!!WXLIVE;
  const rows=locs.map(l=>{const w=wxFor(date,l); if(!w) return ""; const [ic,txt]=wmo(w.c);
    const bad=(w.c>=71&&w.c<=77)||w.c>=85||w.p>=70; const tip=WXTIP[date+"|"+l];
    return `<div class="wxrow${bad?" bad":""}"><div class="wxi" aria-hidden="true">${ic}</div>
    <div class="wxt"><b>${esc(LOCS[l].n)} · ${esc(txt)}</b>${tip?`<span>${esc(tip)}</span>`:""}<span>סיכוי לגשם: ${w.p!=null?w.p+"%":"–"}</span></div>
    <div class="wxn"><b>${w.hi}° / ${w.lo}°</b><span>${f(w.hi)}°F / ${f(w.lo)}°F</span></div></div>`}).join("");
  const links=locs.map(l=>`<a href="${NWS(l)}" target="_blank" rel="noopener">NWS: ${LOCS[l].n}</a>`).join("");
  return `<section class="wx" aria-label="מזג אוויר">${rows}<div class="wxfoot">${live?`<span class="live">● תחזית חיה</span><span>Open-Meteo, עודכנה ב-${WXTIME.toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"})}</span>`:`<span>תחזית מ-18.11, אין חיבור לתחזית חיה</span>`}${links}</div></section>`;
}

function bannerHTML(){
  if(!FLIGHTS||!FLIGHTS.flights) return "";
  return Object.entries(FLIGHTS.flights).filter(([,x])=>flightBad(x)).map(([fl,x])=>
    `<div class="banner"><b>שינוי בטיסה ${esc(fl)}:</b> ${esc(STATUS_HE[x.status]||x.status||"")}${x.depRevised?` · המראה ${hhmm(x.depRevised)}`:""}${x.depGate?` · שער ${esc(x.depGate)}`:""}</div>`).join("");
}

function renderDay(){
  const d=DAYS[dayIdx];
  const dateStr=new Date(d.d+"T12:00:00").toLocaleDateString("he-IL",{day:"numeric",month:"long"});
  const next=DAYS.flatMap(x=>x.items).filter(i=>i.countdown&&new Date(i.countdown)>new Date())[0];
  const showAlerts = dayIdx===0 || d.d===today;
  return `${bannerHTML()}
   <section class="hero${heroEnter?" enter":""}" aria-label="${esc(d.place)}">${sceneSVG(d)}<div class="txt">
     <span class="place">${esc(SCENES[sceneKey(d)].label)}</span>
     <h2>${esc(d.title)}</h2>
     <span class="meta"><span>יום ${dayIdx+1} מתוך ${DAYS.length} · ${d.dow}, ${dateStr}</span><span>לינה: <b>${esc(d.sleep)}</b></span></span></div></section>
   ${wxHTML(d.d)}
   ${next&&showAlerts?`<div class="count">הבא בתור: ${esc(next.title.split("·")[0])} · <b>${untilText(next.countdown)}</b></div>`:""}
   ${showAlerts?`<div class="alerts">${ALERTS.map(a=>`<div class="alert ${a.lvl}"><span class="dot"></span><div>${a.t}</div></div>`).join("")}</div>`:""}
   <section class="timeline">${d.items.map(itemHTML).join("")}</section>
   ${d.tips.length?`<section><h3 class="sect-title">רעיונות ליום</h3><ul class="tips">${d.tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></section>`:""}
   ${d.events.length?`<details class="around" id="around-${d.d}"><summary>מה קורה בסביבה היום (${d.events.length})</summary>
     <div class="evts">${d.events.map(e=>`<div class="evt"><b>${esc(e.n)}</b><span>${esc(e.w)} · ${esc(e.t)}</span>${e.x?`<span>${esc(e.x)}</span>`:""}</div>`).join("")}</div>
     <p class="src">מלוחות אירועים מקומיים, נכון ל-18.11. כדאי לוודא שעות וכרטיסים.</p></details>`:""}`;
}

function renderDocs(){
  return `<div class="alerts"><div class="alert danger"><span class="dot"></span><div>${ALERTS[1].t}</div></div></div>`+
   DOCS.map(g=>`<section class="group"><h2>${g.g}</h2>${g.rows.map(([l,c,s])=>`<div class="row"><span class="l">${esc(l)}</span>${secret(c)}<span class="s">${esc(s)}</span></div>`).join("")}</section>`).join("")+
   `<p class="src">לחיצה על מספר מעתיקה אותו. קודי ה-PIN של Booking נמצאים רק במיילים ובאפליקציה.</p>`;
}

function renderPack(){
  const done=store.get("pack",{}); const n=PACK.filter((_,i)=>done[i]).length;
  return `<section class="group"><h2>רשימת ציוד</h2>
   <div class="progress"><i style="width:${Math.round(n/PACK.length*100)}%"></i></div>
   <p class="src">${n} מתוך ${PACK.length} נארזו. הסימונים נשמרים רק בטלפון הזה.</p>
   <div class="pack">${PACK.map((p,i)=>`<label for="pk${i}"><input type="checkbox" id="pk${i}" data-i="${i}" ${done[i]?"checked":""}><span>${esc(p)}</span></label>`).join("")}</div></section>`;
}

function render(){
  if(view==="days"){ heroEnter = dayIdx!==lastDay; lastDay=dayIdx; document.documentElement.style.setProperty("--hdr", SCENES[sceneKey(DAYS[dayIdx])].hdr); } else document.documentElement.style.setProperty("--hdr","#0E5E6F");
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.view===view));
  $("#lockbtn").textContent = SECRETS ? "🔓 הסתר פרטים" : "🔒 פרטים מוגנים";
  renderStrip();
  const open=[...document.querySelectorAll("details[open]")].map(x=>x.id);
  $("#view").innerHTML = view==="days"?renderDay():view==="docs"?renderDocs():renderPack();
  open.forEach(id=>{const el=document.getElementById(id); if(el) el.open=true;});
  if(view==="pack") $("#view").querySelectorAll("input").forEach(c=>c.onchange=()=>{const d=store.get("pack",{});d[c.dataset.i]=c.checked;store.set("pack",d);render()});
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{view=t.dataset.view;store.set("view",view);render();window.scrollTo({top:0})});
render();
requestAnimationFrame(()=>setTimeout(()=>{ tryStoredKey(); loadWeather(); loadFlights(); },0));
setInterval(()=>{ loadFlights(); if(view==="days"&&$("#unlock").hidden) render(); },5*60000);
setInterval(loadWeather,60*60000);
</script>
