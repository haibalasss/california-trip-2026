<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2C4466">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="קליפורניה">
<title>California Trip 2026</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Rubik:wght@500;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>קליפורניה 2026</h1>
      <div class="fam" role="group" aria-label="משפחה">
        <button class="famb" data-fam="b" aria-pressed="true">בלס</button>
        <button class="famb" data-fam="a" aria-pressed="false">בן אדרת</button>
      </div>
      <button class="lock" id="lockbtn" type="button" aria-label="פרטים מוגנים">🔒</button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-view="days">ימים</button>
      <button class="tab" role="tab" aria-selected="false" data-view="docs">הזמנות</button>
      <button class="tab" role="tab" aria-selected="false" data-view="pack">ציוד</button>
    </div>
  </div>
</header>
<div class="wrap">
  <nav class="strip" id="strip" aria-label="ימי הטיול"></nav>
  <main id="view"></main>
</div>
<div class="scrim" id="unlock" hidden>
  <form class="sheet" id="unlockform" autocomplete="off">
    <h2>הצגת פרטים מוגנים</h2>
    <p>מספרי אישור, קבצי הזמנה ושמות מוצפנים. הקלידו את הסיסמה המשפחתית.</p>
    <input type="password" id="pw" aria-label="סיסמה" autocomplete="current-password">
    <label class="remember"><input type="checkbox" id="remember" checked> לזכור בטלפון הזה</label>
    <div class="err" id="pwerr" role="alert"></div>
    <div class="btns"><button type="button" id="cancel">ביטול</button><button type="submit" class="go">הצג</button></div>
  </form>
</div>
<div class="docview" id="docview" hidden>
  <div class="docbar"><button class="btn" id="docclose" type="button">✕ סגירה</button><span>קובץ ההזמנה המקורי</span></div>
  <iframe id="docframe" title="קובץ ההזמנה" sandbox="allow-popups allow-popups-to-escape-sandbox"></iframe>
</div>
<div class="toast" id="toast" hidden></div>
<script src="vault.js"></script>
<script src="data.js"></script>
<script src="scenes.js"></script>
<script src="app.js"></script>
</body>
</html>
